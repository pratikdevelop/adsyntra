<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500"><rect width="1600" height="1500" fill="#F7F9FC"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2767B2"/></marker></defs><rect x="30" y="25" width="1540" height="100" rx="20" fill="#15365C" stroke="#15365C" stroke-width="1"/><text x="70" y="66" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="start">CONNECT AD ACCOUNTS: ONE SCREEN, TWO CONNECTORS</text><text x="70" y="98" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#E5EEF9" text-anchor="start">User experience stays consistent; OAuth, account discovery and API access are different.</text><rect x="60" y="155" width="1480" height="110" rx="18" fill="#EAF2FC" stroke="#2767B2" stroke-width="2"/><text x="800" y="197" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#2767B2" text-anchor="middle">SHARED CONNECTIONS PAGE</text><text x="800" y="231" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203047" text-anchor="middle">Two cards: [Connect Google Ads]  [Connect Meta Ads] • same connection statuses • same reconnect/disconnect controls</text><line x1="800" y1="265" x2="800" y2="302" stroke="#2767B2" stroke-width="3"/><line x1="430" y1="302" x2="1170" y2="302" stroke="#2767B2" stroke-width="3"/><line x1="430" y1="302" x2="430" y2="330" stroke="#2767B2" stroke-width="3" marker-end="url(#arrow)"/><line x1="1170" y1="302" x2="1170" y2="330" stroke="#2767B2" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="330" width="720" height="440" rx="18" fill="#EAF6EF" stroke="#237A4B" stroke-width="2"/><text x="88" y="372" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#237A4B" text-anchor="start">GOOGLE ADS FLOW</text><rect x="88" y="389" width="180" height="30" rx="15" fill="#FFFFFF"/><text x="178.0" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#237A4B" text-anchor="middle">SEPARATE FLOW</text><text x="92" y="444" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">1. Redirect to Google OAuth 2.0</text><text x="92" y="485" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">2. User consents to Google Ads scope</text><text x="92" y="526" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">3. Callback exchanges code for tokens</text><text x="92" y="567" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">4. Encrypt and store refresh token server-side</text><text x="92" y="608" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">5. List accessible Google Ads customers</text><text x="92" y="649" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">6. User selects customer / account context</text><text x="92" y="690" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">7. Test read request; show Connected / Needs attention</text><rect x="820" y="330" width="720" height="440" rx="18" fill="#F0EBFA" stroke="#6A4AB3" stroke-width="2"/><text x="848" y="372" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#6A4AB3" text-anchor="start">META ADS FLOW</text><rect x="848" y="389" width="180" height="30" rx="15" fill="#FFFFFF"/><text x="938.0" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#6A4AB3" text-anchor="middle">SEPARATE FLOW</text><text x="852" y="444" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">1. Redirect to Meta OAuth / app flow</text><text x="852" y="485" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">2. Request required ads permissions</text><text x="852" y="526" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">3. Callback processes granted access token</text><text x="852" y="567" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">4. Securely store token and expiry/refresh metadata</text><text x="852" y="608" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">5. List businesses and accessible ad accounts</text><text x="852" y="649" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">6. User selects ad account (act_ ID)</text><text x="852" y="690" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203047" text-anchor="start">7. Test read request; show Connected / Needs attention</text><rect x="60" y="800" width="720" height="195" rx="16" fill="#FFFFFF" stroke="#237A4B" stroke-width="2"/><text x="88" y="841" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#237A4B" text-anchor="start">GOOGLE-SPECIFIC CONFIG</text><text x="88" y="877" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203047" text-anchor="start">• OAuth client ID/secret + Ads scope</text><text x="88" y="905" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203047" text-anchor="start">• Developer token for Google Ads API calls</text><text x="88" y="933" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203047" text-anchor="start">• Customer ID and, when acting via a manager, manager context</text><text x="88" y="961" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203047" text-anchor="start">• Refresh token can renew short-lived access tokens</text><rect x="820" y="800" width="720" height="195" rx="16" fill="#FFFFFF" stroke="#6A4AB3" stroke-width="2"/><text x="848" y="841" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#6A4AB3" text-anchor="start">META-SPECIFIC CONFIG</text><text x="848" y="877" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203047" text-anchor="start">• Meta app ID/secret and requested permissions</text><text x="848" y="905" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203047" text-anchor="start">• Access approval/review requirements for customer accounts</text><text x="848" y="933" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203047" text-anchor="start">• Business ID and act_ ad account IDs</text><text x="848" y="961" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203047" text-anchor="start">• Token expiry/validity and permission checks</text><line x1="420" y1="995" x2="420" y2="1030" stroke="#2767B2" stroke-width="3"/><line x1="1180" y1="995" x2="1180" y2="1030" stroke="#2767B2" stroke-width="3"/><line x1="420" y1="1030" x2="1180" y2="1030" stroke="#2767B2" stroke-width="3"/><line x1="800" y1="1030" x2="800" y2="1055" stroke="#2767B2" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="1060" width="1300" height="120" rx="18" fill="#E6F6F3" stroke="#087E78" stroke-width="2"/><text x="800" y="1103" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#087E78" text-anchor="middle">SHARED CONNECTION REGISTRY + ACCOUNT SELECTOR</text><text x="800" y="1138" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203047" text-anchor="middle">Store provider, workspace, external account ID, display name, status, permissions, last successful sync and error summary.</text><line x1="800" y1="1180" x2="800" y2="1205" stroke="#2767B2" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="1210" width="1300" height="115" rx="18" fill="#EAF2FC" stroke="#2767B2" stroke-width="2"/><text x="800" y="1253" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#2767B2" text-anchor="middle">SHARED APP EXPERIENCE</text><text x="800" y="1288" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203047" text-anchor="middle">Dashboard / campaigns / reports call the shared backend; backend routes each request to the matching provider adapter.</text><rect x="60" y="1360" width="1480" height="90" rx="16" fill="#FFF3E2" stroke="#A45C13" stroke-width="2"/><text x="88" y="1396" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#A45C13" text-anchor="start">IMPORTANT</text><text x="88" y="1427" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203047" text-anchor="start">Never use one platform token for the other. Encrypt tokens at rest, restrict them by workspace, support reconnect/revoke, and never expose tokens to frontend code.</text></svg>